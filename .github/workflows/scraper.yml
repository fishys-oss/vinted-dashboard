name: Vinted Scraper

on:
  workflow_dispatch: # <-- C'est cette ligne qui fait apparaître le bouton "Run workflow" !
  schedule:
    - cron: '0 * * * *' # S'exécute automatiquement toutes les heures

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

     - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Exécution du scraper
        run: python scraper.py

      - name: Sauvegarde des données dans le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Mise à jour automatique des données" || exit 0
          git push
