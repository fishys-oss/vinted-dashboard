<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinted Business Suite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .badge {
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .card label {
      color: var(--subtext);
      font-size: 0.875rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .card .val {
      font-size: 1.875rem;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--subtext);
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1 style="margin:0;">Vinted Business Suite</h1>
      <p style="color:var(--subtext); margin:0.25rem 0 0 0;">Analyse automatique du catalogue</p>
    </div>
    <div class="badge">● Sync Cloud Active</div>
  </div>

  <div class="stats">
    <div class="card">
      <label>Articles en ligne</label>
      <div class="val" id="total-items">0</div>
    </div>
    <div class="card">
      <label>Valeur du Stock</label>
      <div class="val" id="total-value">0.00 €</div>
    </div>
    <div class="card">
      <label>Profit Potentiel (Est. 50%)</label>
      <div class="val" id="potential-profit" style="color:var(--accent);">+0.00 €</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Article</th>
        <th>Prix de Vente</th>
        <th>Lien Vinted</th>
      </tr>
    </thead>
    <tbody id="items-list">
      <tr>
        <td colspan="3" style="text-align:center; color:var(--subtext);">Chargement des données...</td>
      </tr>
    </tbody>
  </table>

  <script>
    // URL brute de ton fichier data.json sur GitHub
    const DATA_URL = "https://raw.githubusercontent.com/fishys-oss/vinted-dashboard/main/data.json";

    async function loadDashboard() {
      try {
        // Le paramètre ?t= force la mise à jour immédiate en évitant le cache
        const res = await fetch(`${DATA_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("Fichier introuvable");

        const items = await res.json();
        
        const totalItems = items.length;
        const totalValue = items.reduce((acc, item) => acc + (item.price || 0), 0);
        const estimatedProfit = totalValue * 0.5; // Estimation de marge à 50%

        // Mise à jour des cartes
        document.getElementById("total-items").innerText = totalItems;
        document.getElementById("total-value").innerText = totalValue.toFixed(2) + " €";
        document.getElementById("potential-profit").innerText = "+" + estimatedProfit.toFixed(2) + " €";

        // Remplissage du tableau
        const tbody = document.getElementById("items-list");
        if (items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Aucun article trouvé.</td></tr>';
          return;
        }

        tbody.innerHTML = items.map(item => `
          <tr>
            <td><strong>${item.title}</strong></td>
            <td>${item.price.toFixed(2)} €</td>
            <td><a href="${item.url}" target="_blank">Voir sur Vinted ↗</a></td>
          </tr>
        `).join("");

      } catch (err) {
        console.error("Erreur de chargement :", err);
        document.getElementById("items-list").innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ef4444;">Erreur lors du chargement des données.</td></tr>';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
