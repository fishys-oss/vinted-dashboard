<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinted Business Suite</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #151c28;
      --card-border: #1e293b;
      --accent: #10b981;
      --accent-bg: rgba(16, 185, 129, 0.1);
      --text: #f8fafc;
      --subtext: #64748b;
      --sold: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-title h1::before {
      content: "V";
      background: #8b5cf6;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .header-title p {
      color: var(--subtext);
      font-size: 0.875rem;
      margin-top: 0.25rem;
      margin-left: 2.75rem;
    }

    .badge {
      background: var(--accent-bg);
      color: var(--accent);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .card label {
      color: var(--subtext);
      font-size: 0.75rem;
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }

    .card .val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .card .val.green { color: var(--accent); }

    .table-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      color: var(--subtext);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 0.85rem 1.25rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--card-border);
    }

    tr:last-child td { border-bottom: none; }

    td a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
    }

    td a:hover { color: var(--text); }

    input[type="number"] {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      width: 80px;
      font-size: 0.85rem;
    }

    input[type="number"]:focus {
      outline: 1px solid var(--accent);
    }

    .btn-status {
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .btn-online { background: rgba(16, 185, 129, 0.15); color: var(--accent); }
    .btn-sold { background: rgba(239, 68, 68, 0.15); color: var(--sold); }

    .tag-etat {
      background: #1e293b;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">
      <h1>Vinted Business Suite</h1>
      <p>Analyse automatique et gestion des bénéfices</p>
    </div>
    <div class="badge">● Sync Cloud Active</div>
  </div>

  <div class="stats">
    <div class="card">
      <label>Stock en Ligne</label>
      <div class="val" id="total-items">0</div>
    </div>
    <div class="card">
      <label>Valeur du Stock</label>
      <div class="val" id="total-value">0.00 €</div>
    </div>
    <div class="card">
      <label>Investissement Total</label>
      <div class="val" id="total-cost">0.00 €</div>
    </div>
    <div class="card">
      <label>Bénéfice Réalisé / Potentiel</label>
      <div class="val green" id="total-profit">+0.00 €</div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ARTICLE</th>
          <th>DATE PUB.</th>
          <th>ÉTAT</th>
          <th>PRIX ACHAT (€)</th>
          <th>PRIX VENTE (€)</th>
          <th>BÉNÉFICE</th>
          <th>STATUT</th>
          <th>LIEN</th>
        </tr>
      </thead>
      <tbody id="items-list">
        <tr>
          <td colspan="8" style="text-align:center; color: var(--subtext);">Chargement...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    let localData = JSON.parse(localStorage.getItem('vinted_user_data') || '{}');

    function saveData() {
      localStorage.setItem('vinted_user_data', JSON.stringify(localData));
    }

    async function loadDashboard() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error("Erreur de lecture");

        const items = await res.json();
        if (!Array.isArray(items) || items.length === 0) {
          document.getElementById("items-list").innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--subtext);">Aucun article trouvé.</td></tr>';
          return;
        }

        renderTable(items);

      } catch (err) {
        console.error(err);
        document.getElementById("items-list").innerHTML = '<tr><td colspan="8" style="text-align:center; color: #ef4444;">Erreur d\'accès aux données.</td></tr>';
      }
    }

    function renderTable(items) {
      let onlineCount = 0;
      let totalStockValue = 0;
      let totalCost = 0;
      let totalProfit = 0;

      const tbody = document.getElementById("items-list");
      tbody.innerHTML = items.map(item => {
        const id = item.id;

        // Récupération des données utilisateur locales ou valeurs par défaut
        if (!localData[id]) {
          localData[id] = {
            cost: 0,
            salePrice: item.price || 0,
            isSold: false
          };
        }

        const userItem = localData[id];
        const currentCost = parseFloat(userItem.cost) || 0;
        const currentSalePrice = parseFloat(userItem.salePrice);
        const isSold = userItem.isSold;

        const profit = currentSalePrice - currentCost;

        if (isSold) {
          totalProfit += profit;
        } else {
          onlineCount++;
          totalStockValue += currentSalePrice;
          totalCost += currentCost;
          totalProfit += profit;
        }

        const pubDate = item.scraped_at ? new Date(item.scraped_at).toLocaleDateString('fr-FR') : '—';
        const etat = item.status || 'Très bon état';

        return `
          <tr>
            <td><strong>${item.title || 'Article'}</strong></td>
            <td style="color: var(--subtext); font-size: 0.8rem;">${pubDate}</td>
            <td><span class="tag-etat">${etat}</span></td>
            <td>
              <input type="number" step="0.5" value="${currentCost}" onchange="updateCost('${id}', this.value)" />
            </td>
            <td>
              <input type="number" step="0.5" value="${currentSalePrice}" onchange="updateSalePrice('${id}', this.value)" />
            </td>
            <td style="color: ${profit >= 0 ? 'var(--accent)' : 'var(--sold)'}; font-weight: 600;">
              ${profit >= 0 ? '+' : ''}${profit.toFixed(2)} €
            </td>
            <td>
              <button class="btn-status ${isSold ? 'btn-sold' : 'btn-online'}" onclick="toggleStatus('${id}')">
                ${isSold ? 'Vendu' : 'En ligne'}
              </button>
            </td>
            <td><a href="${item.url}" target="_blank">Voir ↗</a></td>
          </tr>
        `;
      }).join("");

      document.getElementById("total-items").innerText = onlineCount;
      document.getElementById("total-value").innerText = totalStockValue.toFixed(2) + " €";
      document.getElementById("total-cost").innerText = totalCost.toFixed(2) + " €";
      document.getElementById("total-profit").innerText = (totalProfit >= 0 ? "+" : "") + totalProfit.toFixed(2) + " €";

      saveData();
    }

    function updateCost(id, val) {
      if (!localData[id]) localData[id] = {};
      localData[id].cost = parseFloat(val) || 0;
      saveData();
      loadDashboard();
    }

    function updateSalePrice(id, val) {
      if (!localData[id]) localData[id] = {};
      localData[id].salePrice = parseFloat(val) || 0;
      saveData();
      loadDashboard();
    }

    function toggleStatus(id) {
      if (!localData[id]) localData[id] = {};
      localData[id].isSold = !localData[id].isSold;
      saveData();
      loadDashboard();
    }

    loadDashboard();
  </script>
</body>
</html>
