<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinted Business Suite</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #151c28;
      --card-border: #1e293b;
      --accent: #10b981;
      --accent-bg: rgba(16, 185, 129, 0.1);
      --text: #f8fafc;
      --subtext: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-title h1::before {
      content: "V";
      background: #8b5cf6;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .header-title p {
      color: var(--subtext);
      font-size: 0.875rem;
      margin-top: 0.25rem;
      margin-left: 2.75rem;
    }

    .badge {
      background: var(--accent-bg);
      color: var(--accent);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .card label {
      color: var(--subtext);
      font-size: 0.75rem;
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }

    .card .val {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .card .val.green { color: var(--accent); }

    .table-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      color: var(--subtext);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 1rem 1.5rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--card-border);
    }

    tr:last-child td { border-bottom: none; }

    td a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
    }

    td a:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">
      <h1>Vinted Business Suite</h1>
      <p>Analyse automatique du catalogue</p>
    </div>
    <div class="badge">● Sync Cloud Active</div>
  </div>

  <div class="stats">
    <div class="card">
      <label>Articles en ligne</label>
      <div class="val" id="total-items">0</div>
    </div>
    <div class="card">
      <label>Valeur du Stock</label>
      <div class="val" id="total-value">0.00 €</div>
    </div>
    <div class="card">
      <label>Profit Potentiel</label>
      <div class="val green" id="potential-profit">+0.00 €</div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ARTICLE</th>
          <th>PRIX DE VENTE</th>
          <th>PRIX D'ACHAT EST.</th>
          <th>PROFIT ESTIMÉ</th>
          <th>LIEN VINTED</th>
        </tr>
      </thead>
      <tbody id="items-list">
        <tr>
          <td colspan="5" style="text-align:center; color: var(--subtext);">Chargement...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadDashboard() {
      try {
        // Lecture locale directe du fichier data.json servi par Vercel
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error("Erreur de lecture du fichier data.json");

        const items = await res.json();

        if (!Array.isArray(items) || items.length === 0) {
          document.getElementById("items-list").innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--subtext);">Aucun article dans data.json.</td></tr>';
          return;
        }

        const totalItems = items.length;
        const totalValue = items.reduce((acc, item) => acc + (Number(item.price) || 0), 0);
        const estimatedProfit = totalValue * 0.5;

        document.getElementById("total-items").innerText = totalItems;
        document.getElementById("total-value").innerText = totalValue.toFixed(2) + " €";
        document.getElementById("potential-profit").innerText = "+" + estimatedProfit.toFixed(2) + " €";

        const tbody = document.getElementById("items-list");
        tbody.innerHTML = items.map(item => {
          const price = Number(item.price) || 0;
          const cost = price * 0.5;
          const profit = price - cost;

          return `
            <tr>
              <td><strong>${item.title || 'Article'}</strong></td>
              <td>${price.toFixed(2)} €</td>
              <td style="color: var(--subtext);">${cost.toFixed(2)} €</td>
              <td style="color: var(--accent);">+${profit.toFixed(2)} €</td>
              <td><a href="${item.url}" target="_blank">Voir l'article ↗</a></td>
            </tr>
          `;
        }).join("");

      } catch (err) {
        console.error(err);
        document.getElementById("items-list").innerHTML = '<tr><td colspan="5" style="text-align:center; color: #ef4444;">Erreur d\'accès au fichier data.json.</td></tr>';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
