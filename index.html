<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinted Business Suite</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #151c28;
      --card-border: #1e293b;
      --accent: #10b981;
      --accent-bg: rgba(16, 185, 129, 0.1);
      --text: #f8fafc;
      --subtext: #64748b;
      --sold: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    /* Boîte de notifications */
    .notif-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--warning);
      border-radius: 10px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      display: none;
    }

    .notif-title {
      color: var(--warning);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .notif-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-top: 0.5rem;
      border: 1px solid var(--card-border);
    }

    .notif-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .notif-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn {
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
    }

    .btn-confirm { background: var(--accent); color: white; }
    .btn-cancel { background: #334155; color: var(--text); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem;
    }

    .card label {
      color: var(--subtext);
      font-size: 0.75rem;
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }

    .card .val { font-size: 1.5rem; font-weight: 700; }
    .card .val.green { color: var(--accent); }
    .card .val.red { color: var(--sold); }

    .table-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      color: var(--subtext);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1rem;
      border-bottom: 1px solid var(--card-border);
    }
    td { padding: 0.85rem 1rem; font-size: 0.875rem; border-bottom: 1px solid var(--card-border); }

    .item-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .item-img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid var(--card-border);
    }

    input[type="number"] {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      width: 75px;
    }

    input[type="number"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #1e293b;
    }

    .badge-status {
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .st-online { background: rgba(16, 185, 129, 0.15); color: var(--accent); }
    .st-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .st-sold { background: rgba(16, 185, 129, 0.15); color: var(--accent); }
    .st-removed { background: rgba(239, 68, 68, 0.15); color: var(--sold); }
  </style>
</head>
<body>

  <div class="header">
    <h1>Vinted Business Suite</h1>
  </div>

  <!-- Zone de Notification -->
  <div id="notif-box" class="notif-box">
    <div class="notif-title">⚠️ Article(s) ne figurant plus sur Vinted</div>
    <div id="notif-list"></div>
  </div>

  <div class="stats">
    <div class="card"><label>Stock en Ligne</label><div class="val" id="total-items">0</div></div>
    <div class="card"><label>Valeur Estimée Stock</label><div class="val" id="total-value">0.00 €</div></div>
    <div class="card"><label>Total Investi</label><div class="val" id="total-cost">0.00 €</div></div>
    <div class="card"><label>Bénéfice Net Global</label><div class="val" id="total-profit">0.00 €</div></div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Article</th>
          <th>Date Pub.</th>
          <th>Achat (€)</th>
          <th>Vente (€)</th>
          <th>Bénéfice</th>
          <th>Statut</th>
          <th>Lien</th>
        </tr>
      </thead>
      <tbody id="items-list">
        <tr><td colspan="7" style="text-align:center;">Chargement...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let userStore = JSON.parse(localStorage.getItem('vinted_user_store') || '{}');

    function saveStore() {
      localStorage.setItem('vinted_user_store', JSON.stringify(userStore));
    }

    async function initDashboard() {
      const res = await fetch('./data.json?t=' + Date.now());
      const items = await res.json();

      let pendingNotifs = [];

      items.forEach(item => {
        const id = item.id;
        if (!userStore[id]) {
          userStore[id] = {
            cost: 1.00,        // Prix d'achat par défaut
            salePrice: 0.00,    // Vente bloquée à 0 tant que c'est en ligne
            vintedPrice: item.price,
            status: item.is_pending ? 'pending' : 'online'
          };
        } else if (item.is_pending && userStore[id].status === 'online') {
          userStore[id].status = 'pending';
        }

        if (userStore[id].status === 'pending') {
          pendingNotifs.push({ ...item, ...userStore[id] });
        }
      });

      saveStore();
      renderNotifications(pendingNotifs);
      renderDashboard(items);
    }

    function renderNotifications(notifs) {
      const box = document.getElementById('notif-box');
      const list = document.getElementById('notif-list');

      if (notifs.length === 0) {
        box.style.display = 'none';
        return;
      }

      box.style.display = 'block';
      list.innerHTML = notifs.map(item => `
        <div class="notif-item">
          <div class="notif-info">
            <img src="${item.image_url || 'https://via.placeholder.com/40'}" class="item-img" alt="" />
            <span><strong>${item.title}</strong> n'est plus en ligne. A-t-il été vendu ?</span>
          </div>
          <div class="notif-actions">
            <span>Prix Vendu (€) :</span>
            <input type="number" id="real-price-${item.id}" value="${item.vintedPrice || 0}" step="0.5" />
            <button class="btn btn-confirm" onclick="confirmSale('${item.id}')">Oui, Vendu</button>
            <button class="btn btn-cancel" onclick="cancelSale('${item.id}')">Non, Supprimé</button>
          </div>
        </div>
      `).join('');
    }

    function renderDashboard(items) {
      let onlineCount = 0, totalStockValue = 0, totalCost = 0, totalProfit = 0;

      const tbody = document.getElementById('items-list');
      tbody.innerHTML = items.map(item => {
        const id = item.id;
        const meta = userStore[id] || { cost: 1.00, salePrice: 0.00, status: 'online' };

        const cost = parseFloat(meta.cost) || 0;
        const salePrice = meta.status === 'sold' ? (parseFloat(meta.salePrice) || 0) : 0.00;
        const profit = salePrice - cost;

        totalCost += cost;
        totalProfit += profit;

        if (meta.status === 'online') {
          onlineCount++;
          totalStockValue += (item.price || 0);
        }

        let statusBadge = '<span class="badge-status st-online">En ligne</span>';
        if (meta.status === 'pending') statusBadge = '<span class="badge-status st-pending">En attente</span>';
        if (meta.status === 'sold') statusBadge = '<span class="badge-status st-sold">Vendu</span>';
        if (meta.status === 'removed') statusBadge = '<span class="badge-status st-removed">Retiré</span>';

        return `
          <tr>
            <td>
              <div class="item-cell">
                <img src="${item.image_url || 'https://via.placeholder.com/40'}" class="item-img" alt="" />
                <strong>${item.title}</strong>
              </div>
            </td>
            <td style="color:var(--subtext);">${item.published_at || '—'}</td>
            <td><input type="number" value="${cost}" step="0.5" onchange="updateCost('${id}', this.value)" /></td>
            <td>
              <input type="number" value="${salePrice.toFixed(2)}" step="0.5" disabled />
            </td>
            <td style="color:${profit >= 0 ? 'var(--accent)' : 'var(--sold)'}; font-weight:bold;">
              ${profit >= 0 ? '+' : ''}${profit.toFixed(2)} €
            </td>
            <td>${statusBadge}</td>
            <td><a href="${item.url}" target="_blank" style="color:var(--subtext);">Lien ↗</a></td>
          </tr>
        `;
      }).join('');

      const profitElem = document.getElementById('total-profit');
      profitElem.innerText = (totalProfit >= 0 ? "+" : "") + totalProfit.toFixed(2) + " €";
      profitElem.className = "val " + (totalProfit >= 0 ? "green" : "red");

      document.getElementById('total-items').innerText = onlineCount;
      document.getElementById('total-value').innerText = totalStockValue.toFixed(2) + " €";
      document.getElementById('total-cost').innerText = totalCost.toFixed(2) + " €";
    }

    function confirmSale(id) {
      const inputVal = document.getElementById(`real-price-${id}`).value;
      userStore[id].salePrice = parseFloat(inputVal) || 0;
      userStore[id].status = 'sold';
      saveStore();
      initDashboard();
    }

    function cancelSale(id) {
      userStore[id].salePrice = 0.00;
      userStore[id].status = 'removed';
      saveStore();
      initDashboard();
    }

    function updateCost(id, val) {
      userStore[id].cost = parseFloat(val) || 0;
      saveStore();
      initDashboard();
    }

    initDashboard();
  </script>
</body>
</html>
